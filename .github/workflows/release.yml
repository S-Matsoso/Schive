name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux/amd64
            binary: schive
            name: linux-amd64
            package: schive-linux-amd64.tar.gz
            tags: webkit2_41
          - os: windows-latest
            platform: windows/amd64
            binary: schive.exe
            name: windows-amd64
            package: schive-windows-amd64.zip
            tags: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build with Wails
        shell: bash
        run: |
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.17.1 build \
            -clean \
            -platform ${{ matrix.platform }} \
            -tags "${{ matrix.tags }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.package }} -C build/bin ${{ matrix.binary }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "build/bin/${{ matrix.binary }}" -DestinationPath "${{ matrix.package }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: schive-${{ matrix.name }}
          path: ${{ matrix.package }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Build ${{ github.run_number }}
          files: artifacts/*
          generate_release_notes: true